name: Pipeline de sécurité

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Suite de tests de sécurité
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test

  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Gitleaks CLI
        run: |
          curl -sSL https://github.com | tar -xz

      - name: Run Full Security Scan
        run: ./gitleaks detect --source . --verbose

  dependencies:
    name: Vérification des dépendences
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm audit --audit-level=high